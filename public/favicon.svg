<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="oduzz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="oduzz-core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="oduzz-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Dark Background Disc -->
  <circle cx="50" cy="50" r="48" fill="#0b0f19" />

  <!-- Outer Stylized 'O' Aperture Ring -->
  <circle cx="50" cy="50" r="40" stroke="url(#oduzz-grad)" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="200 45" stroke-dashoffset="18" />

  <!-- Smart IoT Nodes around the O ring -->
  <circle cx="50" cy="10" r="4" fill="#38bdf8" />
  <circle cx="90" cy="50" r="4" fill="#8b5cf6" />
  <circle cx="50" cy="90" r="4" fill="#ec4899" />
  <circle cx="10" cy="50" r="4" fill="#06b6d4" />

  <!-- Inner Concentric Orbit -->
  <circle cx="50" cy="50" r="27" stroke="url(#oduzz-grad)" stroke-width="3" stroke-dasharray="95 30" stroke-dashoffset="-25" opacity="0.75" />

  <!-- Connectivity Crossbars -->
  <line x1="32" y1="50" x2="42" y2="50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="58" y1="50" x2="68" y2="50" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="32" x2="50" y2="42" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="68" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />

  <!-- Intelligence Pulse Core -->
  <circle cx="50" cy="50" r="11" fill="url(#oduzz-core)" filter="url(#oduzz-blur)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
</svg>