<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="bg-glow-192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="oduzz-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="oduzz-core-192" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- High-Tech Rounded App Icon Squircle Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg-glow-192)" />
  <rect width="190" height="190" x="1" y="1" rx="41" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Outer Stylized 'O' Aperture Ring -->
  <circle cx="96" cy="96" r="60" stroke="url(#oduzz-grad-192)" stroke-width="10" stroke-linecap="round" stroke-dasharray="300 70" stroke-dashoffset="26" />

  <!-- Smart IoT Nodes -->
  <circle cx="96" cy="36" r="6" fill="#38bdf8" />
  <circle cx="156" cy="96" r="6" fill="#8b5cf6" />
  <circle cx="96" cy="156" r="6" fill="#ec4899" />
  <circle cx="36" cy="96" r="6" fill="#06b6d4" />

  <!-- Inner Concentric Ring -->
  <circle cx="96" cy="96" r="40" stroke="url(#oduzz-grad-192)" stroke-width="5" stroke-dasharray="140 45" stroke-dashoffset="-38" opacity="0.8" />

  <!-- Hub Connection Radians -->
  <line x1="68" y1="96" x2="84" y2="96" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="108" y1="96" x2="124" y2="96" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  <line x1="96" y1="68" x2="96" y2="84" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <line x1="96" y1="108" x2="96" y2="124" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />

  <!-- Pulsing Intelligence Core -->
  <circle cx="96" cy="96" r="16" fill="url(#oduzz-core-192)" />
  <circle cx="96" cy="96" r="7" fill="#ffffff" />
</svg>
