<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="oduzz-grad-lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="oduzz-core-lg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-Tech Rounded App Icon Squircle Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg-glow)" />
  <rect width="508" height="508" x="2" y="2" rx="108" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Stylized 'O' Aperture Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#oduzz-grad-lg)" stroke-width="26" stroke-linecap="round" stroke-dasharray="800 180" stroke-dashoffset="72" filter="url(#glow-lg)" />

  <!-- Smart IoT Nodes -->
  <circle cx="256" cy="96" r="16" fill="#38bdf8" />
  <circle cx="416" cy="256" r="16" fill="#8b5cf6" />
  <circle cx="256" cy="416" r="16" fill="#ec4899" />
  <circle cx="96" cy="256" r="16" fill="#06b6d4" />

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="108" stroke="url(#oduzz-grad-lg)" stroke-width="12" stroke-dasharray="380 120" stroke-dashoffset="-100" opacity="0.8" />

  <!-- Hub Connection Radians -->
  <line x1="184" y1="256" x2="224" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <line x1="288" y1="256" x2="328" y2="256" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="184" x2="256" y2="224" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="288" x2="256" y2="328" stroke="#ec4899" stroke-width="10" stroke-linecap="round" />

  <!-- Pulsing Intelligence Core -->
  <circle cx="256" cy="256" r="44" fill="url(#oduzz-core-lg)" filter="url(#glow-lg)" />
  <circle cx="256" cy="256" r="20" fill="#ffffff" />
</svg>
